[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "secknow"
version = "0.1.0"
description = "Offline CTF knowledge retrieval and graph reasoning platform"
requires-python = ">=3.11,<3.14"
dependencies = [
  "bleach>=6.2,<7",
  "charset-normalizer>=3.4,<4",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jieba>=0.42,<1",
  "markdown-it-py>=3.0,<5",
  "networkx>=3.4,<4",
  "numpy>=2.1,<3",
  "orjson>=3.10,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pymupdf>=1.25,<2",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6.0,<7",
  "scikit-learn>=1.6,<2",
  "scipy>=1.14,<2",
  "uvicorn[standard]>=0.34,<1"
]

[project.optional-dependencies]
ocr = [
  "pillow>=11,<13",
  "pytesseract>=0.3.13,<1"
]
parse = [
  "llama-index-core>=0.12,<1",
  "pillow>=11,<13",
  "pytesseract>=0.3.13,<1",
  "tree-sitter-language-pack>=0.7,<1",
  "unstructured[docx,pdf]>=0.17,<1"
]
semantic = [
  "FlagEmbedding>=1.3,<2",
  "neo4j>=5.27,<7",
  "pymilvus>=2.6,<4",
  "sentencepiece>=0.2,<1",
  "torch>=2.6,<3",
  # FlagEmbedding 1.x still relies on tokenizer APIs removed in Transformers 5.
  "transformers>=4.48,<5"
]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1"
]

[project.scripts]
secknow = "secknow.cli:main"
secknow-api = "secknow.main:run"
secknow-worker = "secknow.worker:run"

[tool.hatch.build.targets.wheel]
packages = ["src/secknow"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["secknow"]

[[tool.mypy.overrides]]
module = [
  "FlagEmbedding",
  "PIL",
  "bleach",
  "fitz",
  "jieba",
  "joblib",
  "llama_index.*",
  "neo4j",
  "networkx",
  "pymilvus",
  "pytesseract",
  "scipy.*",
  "sklearn.*",
  "tree_sitter_language_pack",
  "unstructured.*",
  "yaml"
]
ignore_missing_imports = true
